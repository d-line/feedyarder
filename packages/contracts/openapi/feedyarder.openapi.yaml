openapi: 3.1.0
info:
  title: Feedyarder API
  version: 0.1.0
  description: Public API contract for the Feedyarder web client.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: API health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Check whether bootstrap has already been completed
      responses:
        "200":
          description: Current setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
  /setup:
    post:
      operationId: createInitialUser
      summary: Bootstrap the single local user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Setup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /session:
    post:
      operationId: createSession
      summary: Create a login session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      summary: Delete the current session
      responses:
        "204":
          description: Session deleted
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /folders:
    get:
      operationId: listFolders
      summary: List folders
      responses:
        "200":
          description: Folder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FolderResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createFolder
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feeds:
    get:
      operationId: listFeeds
      summary: List feeds
      responses:
        "200":
          description: Feed list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createFeed
      summary: Create a feed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedRequest"
      responses:
        "201":
          description: Feed created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feeds/{id}:
    patch:
      operationId: updateFeed
      summary: Update feed metadata or paused state
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeedRequest"
      responses:
        "200":
          description: Feed updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feed not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFeed
      summary: Delete a feed and cascade-delete its items and fetch history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Feed deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feed not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feeds/{id}/retry:
    post:
      operationId: retryFeedNow
      summary: Queue a feed for immediate retry and ensure it is unpaused
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Feed scheduled for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feed not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fetch-events:
    get:
      operationId: listFetchEvents
      summary: List recent fetch events
      parameters:
        - in: query
          name: feedId
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Fetch event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FetchEventResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /opml/import:
    post:
      operationId: importOpml
      summary: Import feeds and folders from an OPML document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportOpmlRequest"
      responses:
        "201":
          description: OPML import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportOpmlResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /opml/export:
    get:
      operationId: exportOpml
      summary: Export the current feed tree as OPML
      responses:
        "200":
          description: OPML document
          content:
            application/xml:
              schema:
                type: string
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /items:
    get:
      operationId: listItems
      summary: List items with cursor pagination and filters
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: feedId
          schema:
            type: string
            format: uuid
        - in: query
          name: folderId
          schema:
            type: string
            format: uuid
        - in: query
          name: read
          schema:
            type: boolean
        - in: query
          name: starred
          schema:
            type: boolean
        - in: query
          name: q
          schema:
            type: string
      responses:
        "200":
          description: Item page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /items/{id}/state:
    patch:
      operationId: updateItemState
      summary: Update read/starred state for a single item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemStateRequest"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok, service]
      properties:
        ok:
          type: boolean
        service:
          type: string
          enum: [api]
    SetupRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 256
    SessionRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, username, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    SetupStatusResponse:
      type: object
      additionalProperties: false
      required: [setupCompleted]
      properties:
        setupCompleted:
          type: boolean
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        position:
          type: integer
          minimum: 0
    FolderResponse:
      type: object
      additionalProperties: false
      required: [id, title, position, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
    CreateFeedRequest:
      type: object
      additionalProperties: false
      required: [feedUrl]
      properties:
        feedUrl:
          type: string
          format: uri
        title:
          type: [string, "null"]
          maxLength: 256
        siteUrl:
          type: [string, "null"]
          format: uri
        folderId:
          type: [string, "null"]
          format: uuid
    UpdateFeedRequest:
      type: object
      additionalProperties: false
      properties:
        feedUrl:
          type: string
          format: uri
        title:
          type: [string, "null"]
          maxLength: 256
        siteUrl:
          type: [string, "null"]
          format: uri
        folderId:
          type: [string, "null"]
          format: uuid
        isPaused:
          type: boolean
    FeedResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - folderId
        - title
        - siteUrl
        - feedUrl
        - faviconUrl
        - status
        - isPaused
        - fetchIntervalMinutes
        - consecutiveErrorCount
        - lastSuccessAt
        - lastErrorAt
        - lastErrorCategory
        - lastErrorMessage
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        folderId:
          type: [string, "null"]
          format: uuid
        title:
          type: [string, "null"]
        siteUrl:
          type: [string, "null"]
          format: uri
        feedUrl:
          type: string
          format: uri
        faviconUrl:
          type: [string, "null"]
          format: uri
        status:
          type: string
        isPaused:
          type: boolean
        fetchIntervalMinutes:
          type: integer
        consecutiveErrorCount:
          type: integer
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        lastErrorAt:
          type: [string, "null"]
          format: date-time
        lastErrorCategory:
          type: [string, "null"]
        lastErrorMessage:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    FetchEventResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - feedId
        - feedTitle
        - feedUrl
        - status
        - errorCategory
        - errorMessage
        - httpStatus
        - missingPublishedAtCount
        - fetchedAt
        - durationMs
      properties:
        id:
          type: string
          format: uuid
        feedId:
          type: string
          format: uuid
        feedTitle:
          type: [string, "null"]
        feedUrl:
          type: string
          format: uri
        status:
          type: string
        errorCategory:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
        httpStatus:
          type: [integer, "null"]
        missingPublishedAtCount:
          type: integer
        fetchedAt:
          type: string
          format: date-time
        durationMs:
          type: [integer, "null"]
    ImportOpmlRequest:
      type: object
      additionalProperties: false
      required: [opml]
      properties:
        opml:
          type: string
    ImportOpmlResponse:
      type: object
      additionalProperties: false
      required:
        - createdFeedCount
        - createdFolderCount
        - skippedFeedCount
      properties:
        createdFeedCount:
          type: integer
        createdFolderCount:
          type: integer
        skippedFeedCount:
          type: integer
    ItemResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - feedId
        - feedTitle
        - title
        - url
        - author
        - summaryText
        - contentHtml
        - publishedAt
        - isRead
        - isStarred
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        feedId:
          type: string
          format: uuid
        feedTitle:
          type: [string, "null"]
        title:
          type: [string, "null"]
        url:
          type: [string, "null"]
          format: uri
        author:
          type: [string, "null"]
        summaryText:
          type: [string, "null"]
        contentHtml:
          type: [string, "null"]
        publishedAt:
          type: [string, "null"]
          format: date-time
        isRead:
          type: boolean
        isStarred:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ItemListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemResponse"
        nextCursor:
          type: [string, "null"]
    UpdateItemStateRequest:
      type: object
      additionalProperties: false
      properties:
        isRead:
          type: boolean
        isStarred:
          type: boolean
