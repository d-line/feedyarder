services:
  postgres:
    image: postgres:17
    container_name: feedyarder-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feedyarder}
      POSTGRES_USER: ${POSTGRES_USER:-feedyarder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedyarder}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedyarder} -d ${POSTGRES_DB:-feedyarder}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: feedyarder-migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-feedyarder}:${POSTGRES_PASSWORD:-feedyarder}@postgres:5432/${POSTGRES_DB:-feedyarder}
      NODE_ENV: production
    command: ["node", "packages/db/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: feedyarder-api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-feedyarder}:${POSTGRES_PASSWORD:-feedyarder}@postgres:5432/${POSTGRES_DB:-feedyarder}
      NODE_ENV: production
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-feedyarder_session}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-30}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: feedyarder-worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-feedyarder}:${POSTGRES_PASSWORD:-feedyarder}@postgres:5432/${POSTGRES_DB:-feedyarder}
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-60000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-50}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      FETCH_CONNECT_TIMEOUT_MS: ${FETCH_CONNECT_TIMEOUT_MS:-10000}
      FETCH_TOTAL_TIMEOUT_MS: ${FETCH_TOTAL_TIMEOUT_MS:-60000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    container_name: feedyarder-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
