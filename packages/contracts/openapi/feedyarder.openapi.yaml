openapi: 3.1.0
info:
  title: Feedyarder API
  version: 0.1.0
  description: Public API contract for the Feedyarder web client.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: API health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /setup:
    get:
      operationId: getSetupStatus
      summary: Check whether bootstrap has already been completed
      responses:
        "200":
          description: Current setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
    post:
      operationId: createInitialUser
      summary: Bootstrap the single local user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Setup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /session:
    post:
      operationId: createSession
      summary: Create a login session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      summary: Delete the current session
      responses:
        "204":
          description: Session deleted
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /folders:
    get:
      operationId: listFolders
      summary: List folders
      responses:
        "200":
          description: Folder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FolderResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createFolder
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feeds:
    get:
      operationId: listFeeds
      summary: List feeds
      responses:
        "200":
          description: Feed list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createFeed
      summary: Create a feed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedRequest"
      responses:
        "201":
          description: Feed created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - service
      properties:
        ok:
          type: boolean
        service:
          type: string
          enum:
            - api
    SetupRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 256
    SessionRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: true
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    SetupStatusResponse:
      type: object
      additionalProperties: false
      required:
        - setupCompleted
      properties:
        setupCompleted:
          type: boolean
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        position:
          type: integer
          minimum: 0
    FolderResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - position
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
    CreateFeedRequest:
      type: object
      additionalProperties: false
      required:
        - feedUrl
      properties:
        feedUrl:
          type: string
          format: uri
        title:
          type:
            - string
            - "null"
          maxLength: 256
        siteUrl:
          type:
            - string
            - "null"
          format: uri
        folderId:
          type:
            - string
            - "null"
          format: uuid
    FeedResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - folderId
        - title
        - siteUrl
        - feedUrl
        - faviconUrl
        - status
        - isPaused
        - fetchIntervalMinutes
        - consecutiveErrorCount
        - lastSuccessAt
        - lastErrorAt
        - lastErrorCategory
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        folderId:
          type:
            - string
            - "null"
          format: uuid
        title:
          type:
            - string
            - "null"
        siteUrl:
          type:
            - string
            - "null"
          format: uri
        feedUrl:
          type: string
          format: uri
        faviconUrl:
          type:
            - string
            - "null"
          format: uri
        status:
          type: string
        isPaused:
          type: boolean
        fetchIntervalMinutes:
          type: integer
        consecutiveErrorCount:
          type: integer
        lastSuccessAt:
          type:
            - string
            - "null"
          format: date-time
        lastErrorAt:
          type:
            - string
            - "null"
          format: date-time
        lastErrorCategory:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
